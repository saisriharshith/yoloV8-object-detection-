# ==============================================================================
# Render Blueprint Specification (render.yaml)
# YOLOv8 Real-Time Object Detection & Live Video Analytics Platform
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: yolov8-video-analytics
    env: docker
    plan: starter # Starter plan recommended for video decoding (512MB-2GB RAM)
    region: oregon # or frankfurt, ohio, singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: 10000
